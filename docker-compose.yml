version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: exam_proctor_db
    restart: always
    environment:
      POSTGRES_DB: exam_proctor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_db_password_here
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ai-service:
    build: ./ai-service
    container_name: exam_proctor_ai
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=your_gemini_api_key_here
      - BACKEND_URL=http://backend:3001
    volumes:
      - flags_data:/app/flags
    depends_on:
      - postgres

  backend:
    build: ./backend
    container_name: exam_proctor_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - JWT_SECRET=your_super_secret_key
      - FRONTEND_URL=http://localhost:3000
      - AI_SERVICE_URL=http://ai-service:8000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=exam_proctor
      - DB_USER=postgres
      - DB_PASSWORD=your_db_password_here
    volumes:
      - flags_data:/ai-service/flags
    depends_on:
      - postgres

volumes:
  postgres_data:
  flags_data:
